services:

  nginx:
    image: brayandevzn/n8n_server:proxy
    build:
      context: ../..
      dockerfile: src/controller/dockerfile.proxy
    ports:
      - "800:800"

    depends_on:
      - api_n8n
      - n8n

  redis:
    image: redis:alpine
    
  api_n8n:
    image: brayandevzn/n8n_server:api

    build:
      context: ../..
      dockerfile: src/controller/dockerfile.api

    depends_on:
      - redis
      - n8n
    env_file:
      - ../config/.env
   
  n8n:
    image: brayandevzn/n8n_server:n8n
    build:
      context: ../..
      dockerfile: src/controller/dockerfile.n8n
   
  

  
    
    
  
