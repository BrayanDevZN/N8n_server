name: docker build

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main


jobs:

    build:

        runs-on: ubuntu-latest

        environment: prod

        env:
                rate_limit: ${{ secrets.RATE_LIMIT }}
                global_rate_limit: ${{ secrets.GLOBAL_RATE_LIMIT }}
                origin: ${{ secrets.ORIGIN }}
                environment: ${{ secrets.ENVIRONMENT }}
                block: ${{ secrets.BLOCK }}
                block_limit: ${{ secrets.BLOCK_LIMIT }}

        steps:

            - uses: actions/checkout@v4

            - name: Create .env
              run: |
                    mkdir -p src/config
                    cat > src/config/.env << EOF
                    REDIS_HOST=${{ secrets.REDIS_HOST }}
                    REDIS_PORT=${{ secrets.REDIS_PORT }}
                    JWT_SECRET=${{ secrets.JWT_SECRET }}
                    DATABASE_URL=${{ secrets.DATABASE_URL }}
                    EOF


            - name: init docker
              run: docker compose -f compose.n8n.yml up -d --build

            - name: Test container readiness
              run: |
                    for attempt in {1..12}; do
                      echo "Health check attempt ${attempt}/12..."

                      if docker compose -f compose.n8n.yml exec -T nginx \
                        wget -q -T 5 -t 1 -O /dev/null http://localhost:800/; then
                        echo "Container is healthy and responding over HTTP."
                        exit 0
                      fi

                      sleep 5
                    done

                    echo "Container did not become ready in time."
                    docker compose -f compose.n8n.yml ps
                    docker compose -f compose.n8n.yml logs --no-color
                    exit 1
