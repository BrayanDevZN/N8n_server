services:
  redis:
    image: redis:alpine


  nginx:
    image: brayandevzn/n8n_server:proxy
    ports:
    - "800:800"

    depends_on:
      - api_n8n


  api_n8n:
    image: brayandevzn/n8n_server:api

    env_file:
      - src/config/.env

    depends_on:
      - redis
      - n8n
  
  n8n:
    image: brayandevzn/n8n_server:n8n
    volumes:
      - n8n:/home/node/.n8n

volumes:
    n8n:

  

    

  




    
   